substitutions:
  name: gym-bt-proxy
  friendly_name: Gym Bluetooth Proxy

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: "jernej.gym-nordlux-mesh"
    version: "1.0"

# M5Stack M5Stamp C3U (ESP32-C3). Bluetooth requires the ESP-IDF framework.
esp32:
  board: esp32c3
  variant: ESP32C3
  framework:
    type: esp-idf

# Home Assistant API connection.
# Generate the key once with:  openssl rand -base64 32
api:
  encryption:
    key: "REPLACE_WITH_openssl_rand_base64_32"
  reboot_timeout: 0s   # let HA be down without the proxy rebooting

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # better BLE responsiveness
  ap:
    ssid: "GymProxy Fallback"
    password: "changeme123"

ota:
  - platform: esphome
    password: "REPLACE_WITH_openssl_rand_base64_32"

# The whole point: active GATT proxy so Home Assistant can hold the
# Mesh Proxy connection to the Nordlux lights through this board.
bluetooth_proxy:
  active: true

esp32_ble:
  # C3 nimble scanner defaults are fine; no extra config needed

# Button to identify the board (blinks the on-board SK6812 LED)
button:
  - platform: template
    name: "Identify Proxy"
    on_press:
      then:
        - light.turn_on:
            id: status_led
            brightness: 100%
        - delay: 2s
        - light.turn_off: status_led

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Proxy Status LED"
    rgb_order: GRB
    pin: GPIO2          # SK6812 on the M5Stamp C3U
    num_leds: 1
    rmt_channel: 0
    chipset: SK6812
